name: Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  detect-version:
    runs-on: windows-2022
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.detect.outputs.publish }}
      version: ${{ steps.detect.outputs.version }}
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Detect an unpublished version
        id: detect
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Releases must start from main' }
          $version = ((Get-Content desktopApp/resources/version.properties | Where-Object { $_ -match '^version=' }) -replace '^version=', '').Trim()
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Version must be MAJOR.MINOR.PATCH' }
          $tag = "v$version"
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if (-not (Get-Content CHANGELOG.md | Where-Object { $_.Trim() -eq "## $version" })) { throw "CHANGELOG.md has no notes for $version" }
          $releases = gh release list --limit 1000 --json tagName,isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not list existing releases' }
          $matchingRelease = $releases | Where-Object { $_.tagName -eq $tag } | Select-Object -First 1
          if ($matchingRelease -and $matchingRelease.isDraft) { throw "$tag has an unfinished draft release; inspect it before retrying" }
          if ($matchingRelease) {
            "publish=false" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "$tag is already published; skipping."
            exit 0
          }
          $olderVersions = @($releases | Where-Object { -not $_.isDraft -and $_.tagName -match '^v[0-9]+\.[0-9]+\.[0-9]+$' } | ForEach-Object { [version]$_.tagName.Substring(1) })
          if ($olderVersions.Count -gt 0 -and [version]$version -le ($olderVersions | Sort-Object -Descending | Select-Object -First 1)) { throw "$tag must be newer than existing releases" }
          $existingTag = git ls-remote --tags --refs origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Could not check remote tags' }
          if ($existingTag) { throw "$tag already exists without a published release; inspect it before retrying" }
          "publish=true" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "$tag is new and eligible for validation."

  validate-package:
    needs: detect-version
    if: needs.detect-version.outputs.publish == 'true'
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate tag and release prerequisites
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.detect-version.outputs.version }}
        run: |
          $version = ((Get-Content desktopApp/resources/version.properties | Where-Object { $_ -match '^version=' }) -replace '^version=', '').Trim()
          if ($version -ne $env:RELEASE_VERSION) { throw 'Version changed during validation' }
          if (-not (Test-Path LICENSE)) { throw 'LICENSE must be finalized before publishing' }
          if ((Get-FileHash LICENSE -Algorithm SHA256).Hash -ne 'CC9829233DE2B0BA9F107178CF4DA58612848A70F07B2344EAB1F1EC6DF1F3FC') { throw 'MIT License text or copyright notice differs from the verified version' }
          if ((Get-Content README.md -Raw) -notmatch '\[MIT License\]\(LICENSE\)') { throw 'README must link to the MIT License' }
          if (-not (Test-Path CHANGELOG.md)) { throw 'Release notes are missing' }
          if (-not (Test-Path docs/RELEASING.md)) { throw 'Release instructions are missing' }
      - name: Install pinned WiX 3.14.1 build tools
        shell: pwsh
        run: |
          $url = 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip'
          Invoke-WebRequest -Uri $url -OutFile wix314-binaries.zip
          $expected = '6AC824E1642D6F7277D0ED7EA09411A508F6116BA6FAE0AA5F2C7DAA2FF43D31'
          if ((Get-FileHash wix314-binaries.zip -Algorithm SHA256).Hash -ne $expected) { throw 'WiX checksum mismatch' }
          New-Item -ItemType Directory -Force build/wix314 | Out-Null
          Expand-Archive wix314-binaries.zip -DestinationPath build/wix314
          (Resolve-Path build/wix314).Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build, test, and package MSI
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Msi
      - name: Install and smoke-check MSI
        shell: pwsh
        run: |
          $version = ((Get-Content desktopApp/resources/version.properties | Where-Object { $_ -match '^version=' }) -replace '^version=', '').Trim()
          $msi = (Resolve-Path "build/distribution/artifacts/AggressivePomodoro-$version.msi").Path
          $install = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "MSI install failed: $($install.ExitCode)" }
          try {
            $exe = Join-Path $env:ProgramFiles 'AggressivePomodoro/AggressivePomodoro.exe'
            if (-not (Test-Path $exe)) { throw "Installed app missing: $exe" }
            $app = Start-Process -FilePath $exe -WindowStyle Hidden -PassThru
            try {
              Start-Sleep -Seconds 5
              $app.Refresh()
              if ($app.HasExited) { throw "Installed app exited early: $($app.ExitCode)" }
            } finally {
              if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
            }
          } finally {
            $uninstall = Start-Process msiexec.exe -ArgumentList @('/x', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "MSI uninstall failed: $($uninstall.ExitCode)" }
          }
      - name: Verify upgrade from the published 0.1.0 installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ((Get-Content desktopApp/resources/version.properties | Where-Object { $_ -match '^version=' }) -replace '^version=', '').Trim()
          $baselineDirectory = Join-Path $env:RUNNER_TEMP 'pomodoro-upgrade-baseline'
          gh release download v0.1.0 --repo $env:GITHUB_REPOSITORY --pattern 'AggressivePomodoro-0.1.0.msi' --dir $baselineDirectory
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the published upgrade baseline' }
          $baselineMsi = Join-Path $baselineDirectory 'AggressivePomodoro-0.1.0.msi'
          $baselineHash = '96EA04E7893D8F8CD9D9AC070DD014ECE6ECACB6E866658C625E369459E28BB6'
          if ((Get-FileHash $baselineMsi -Algorithm SHA256).Hash -ne $baselineHash) { throw 'Upgrade baseline checksum mismatch' }
          $newMsi = (Resolve-Path "build/distribution/artifacts/AggressivePomodoro-$version.msi").Path
          $baselineProductCode = '{50B90F77-B8D1-3BDD-AC8F-48DF142D69B8}'
          $upgradeCode = '{8B4BB341-127A-3A18-945B-B92F5C0CD1FD}'
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $installer.OpenDatabase($newMsi, 0)
          $view = $database.OpenView('SELECT `Property`, `Value` FROM `Property`')
          $view.Execute()
          $properties = @{}
          while ($record = $view.Fetch()) { $properties[$record.StringData(1)] = $record.StringData(2) }
          $view.Close()
          [void][System.Runtime.InteropServices.Marshal]::FinalReleaseComObject($view)
          [void][System.Runtime.InteropServices.Marshal]::FinalReleaseComObject($database)
          if ($properties['UpgradeCode'] -ne $upgradeCode) { throw 'UpgradeCode differs from the published baseline' }
          if ($properties['ProductVersion'] -ne $version) { throw 'Upgrade MSI has the wrong version' }
          $newProductCode = $properties['ProductCode']
          if ($newProductCode -eq $baselineProductCode) { throw 'The new version must have a different MSI ProductCode' }

          function Invoke-Msi([string]$action, [string]$path) {
            $process = Start-Process msiexec.exe -ArgumentList @($action, "`"$path`"", '/qn', '/norestart') -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010)) { throw "MSI $action failed: $($process.ExitCode)" }
          }
          function Start-AppAndClose([string]$exe) {
            $app = Start-Process -FilePath $exe -WindowStyle Hidden -PassThru
            try {
              Start-Sleep -Seconds 5
              $app.Refresh()
              if ($app.HasExited) { throw "Upgrade smoke app exited early: $($app.ExitCode)" }
              if (-not $app.CloseMainWindow()) { throw 'Could not request a normal app close during upgrade verification' }
              if (-not $app.WaitForExit(15000)) { throw 'App did not save and close during upgrade verification' }
              if ($app.ExitCode -ne 0) { throw "App close failed: $($app.ExitCode)" }
            } finally {
              $app.Refresh()
              if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
            }
          }
          $previousAppData = $env:APPDATA
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'pomodoro-upgrade-profile'
          $profileDirectory = Join-Path $env:APPDATA 'AggressivePomodoro'
          New-Item -ItemType Directory -Force $profileDirectory | Out-Null
          $snapshot = Join-Path $profileDirectory 'session.properties'
          @'
          version=2
          phase=FOCUS
          status=PAUSED
          phaseId=1
          completedFocus=2
          focusInCycle=2
          durationMs=1500000
          remainingMs=900000
          pending=
          focusMinutes=25
          shortBreakMinutes=5
          longBreakMinutes=15
          longBreakEvery=4
          automaticTransitions=true
          soundEnabled=false
          clickSoundEnabled=false
          taskIds=1
          selectedTaskId=1
          nextTaskId=2
          activeTaskId=1
          task.1.title=Upgrade verification task
          task.1.estimate=3
          task.1.completed=2
          task.1.done=false
          historyDays=2026-09-28
          day.2026-09-28.sessions=2
          day.2026-09-28.focusedMs=3000000
          '@ | Set-Content -LiteralPath $snapshot -Encoding ascii
          $exe = Join-Path $env:ProgramFiles 'AggressivePomodoro/AggressivePomodoro.exe'
          try {
            Invoke-Msi '/i' $baselineMsi
            if ($installer.ProductState($baselineProductCode) -ne 5) { throw 'Published baseline was not installed' }
            Start-AppAndClose $exe
            Invoke-Msi '/i' $newMsi
            if ($installer.ProductState($baselineProductCode) -ne -1) { throw 'The old version remains installed beside the upgrade' }
            if ($installer.ProductState($newProductCode) -ne 5) { throw 'The new MSI product is not installed' }
            Start-AppAndClose $exe
            $saved = @{}
            foreach ($line in Get-Content -LiteralPath $snapshot) {
              if ($line -match '^[^#!][^=]*=') { $parts = $line -split '=', 2; $saved[$parts[0]] = $parts[1] }
            }
            foreach ($entry in @{
              version = '3'; status = 'PAUSED'; remainingMs = '900000'; activeTaskId = '1';
              'task.1.title' = 'Upgrade verification task'; 'task.1.completed' = '2';
              'day.2026-09-28.sessions' = '2'; 'day.2026-09-28.focusedMs' = '3000000'
            }.GetEnumerator()) {
              if ($saved[$entry.Key] -ne $entry.Value) { throw "Upgrade did not preserve snapshot field $($entry.Key)" }
            }
            "Verified upgrade from 0.1.0 to ${version}: old product removed; paused timer, task credit, and history preserved." | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          } finally {
            $env:APPDATA = $previousAppData
            try {
              if ($installer.ProductState($newProductCode) -eq 5) { Invoke-Msi '/x' $newMsi }
              if ($installer.ProductState($baselineProductCode) -eq 5) { Invoke-Msi '/x' $baselineMsi }
            } finally {
              [void][System.Runtime.InteropServices.Marshal]::FinalReleaseComObject($installer)
            }
          }
      - name: Verify MSI checksum
        shell: pwsh
        run: |
          $artifacts = 'build/distribution/artifacts'
          $line = (Get-Content "$artifacts/SHA256SUMS.txt" | Select-Object -First 1).Trim()
          $parts = $line -split '\s+', 2
          $msi = Join-Path $artifacts $parts[1]
          if ((Get-FileHash $msi -Algorithm SHA256).Hash.ToLowerInvariant() -ne $parts[0]) { throw 'MSI checksum mismatch' }
      - name: Preserve verified release files
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-${{ needs.detect-version.outputs.tag }}
          path: |
            build/distribution/artifacts/*.msi
            build/distribution/artifacts/SHA256SUMS.txt
            build/distribution/artifacts/LICENSE
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [detect-version, validate-package]
    runs-on: windows-2022
    environment: release
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: windows-release-${{ needs.detect-version.outputs.tag }}
          path: build/distribution/artifacts
      - name: Verify artifact and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.detect-version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.detect-version.outputs.version }}
        run: |
          $artifacts = 'build/distribution/artifacts'
          $line = (Get-Content "$artifacts/SHA256SUMS.txt" | Select-Object -First 1).Trim()
          $parts = $line -split '\s+', 2
          $msi = Join-Path $artifacts $parts[1]
          if (-not (Test-Path $msi)) { throw "MSI missing: $msi" }
          if ((Get-FileHash $msi -Algorithm SHA256).Hash.ToLowerInvariant() -ne $parts[0]) { throw 'MSI checksum mismatch' }
          $license = Join-Path $artifacts 'LICENSE'
          if (-not (Test-Path $license)) { throw 'MIT License asset is missing' }
          if ((Get-FileHash $license -Algorithm SHA256).Hash -ne 'CC9829233DE2B0BA9F107178CF4DA58612848A70F07B2344EAB1F1EC6DF1F3FC') { throw 'MIT License asset changed' }
          $existingTag = git ls-remote --tags --refs origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Could not recheck remote tags' }
          if ($existingTag) { throw "$env:RELEASE_TAG appeared during validation; refusing to retarget it" }
          $pattern = '(?ms)^##\s+' + [regex]::Escape($env:RELEASE_VERSION) + '\s*\r?\n(?<notes>.*?)(?=^##\s+|\z)'
          $match = [regex]::Match((Get-Content CHANGELOG.md -Raw), $pattern)
          if (-not $match.Success -or -not $match.Groups['notes'].Value.Trim()) { throw 'Version release notes are missing' }
          [System.IO.File]::WriteAllText('release-notes.md', $match.Groups['notes'].Value.Trim() + [Environment]::NewLine)
          gh release create $env:RELEASE_TAG $msi "$artifacts/SHA256SUMS.txt" $license --target $env:GITHUB_SHA --title "Aggressive Pomodoro $env:RELEASE_TAG" --notes-file release-notes.md --fail-on-no-commits
